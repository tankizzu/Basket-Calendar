name: Build APK

on:
  push:
    branches: [main]
    # i soli dati delle partite arrivano all'app da soli: non serve un nuovo APK
    paths-ignore:
      - 'app/src/main/assets/www/data.js'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compila APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Rinomina APK
        run: |
          N=${{ github.run_number }}
          cp app/build/outputs/apk/personale/release/app-personale-release.apk CalendariBasket-v$N.apk
          cp app/build/outputs/apk/bulldogs/release/app-bulldogs-release.apk CalendariBulldogs-v$N.apk
          cp app/build/outputs/apk/lions/release/app-lions-release.apk CalendariLions-v$N.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CalendariBasket-v${{ github.run_number }}
          path: Calendari*-v${{ github.run_number }}.apk

      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Calendari Basket v${{ github.run_number }}
          files: |
            CalendariBasket-v${{ github.run_number }}.apk
            CalendariBulldogs-v${{ github.run_number }}.apk
            CalendariLions-v${{ github.run_number }}.apk
          make_latest: true
