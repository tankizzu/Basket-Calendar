name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compila APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Rinomina APK
        run: cp app/build/outputs/apk/release/app-release.apk CalendariBasket-v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CalendariBasket-v${{ github.run_number }}
          path: CalendariBasket-v${{ github.run_number }}.apk

      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Calendari Basket v${{ github.run_number }}
          files: CalendariBasket-v${{ github.run_number }}.apk
          make_latest: true
